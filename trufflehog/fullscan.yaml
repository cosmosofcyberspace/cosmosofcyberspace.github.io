trufflehog_full:
  stage: test
  image:
    name: trufflesecurity/trufflehog@sha256:<PINNED_DIGEST>
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(master|dev|release.*)$/'
  variables:
    GIT_DEPTH: "0"        # full history için zorunlu
  script:
    - set +e
    - |
      trufflehog git "file://$CI_PROJECT_DIR" \
        --no-verification \
        --results=unknown \
        --json | tee trufflehog-full.json || true
  artifacts:
    when: always
    paths:
      - trufflehog-full.json
    expire_in: 1 week
